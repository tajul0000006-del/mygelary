<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyGelary | Photo Gallery</title>
<meta name="description" content="MyGelary - সুন্দর ছবির সংগ্রহ। ছবি দেখুন, খুঁজুন ও ডাউনলোড করুন।">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#202124}
header{position:sticky;top:0;background:#fff;padding:9px 4%;box-shadow:0 2px 8px #00000010;z-index:10;display:flex;align-items:center;gap:12px}
.logo{font-size:21px;font-weight:bold;color:#168451;white-space:nowrap}
.search{flex:1;min-width:0;padding:11px 14px;border:1px solid #ddd;border-radius:25px;font-size:14px;outline:none}
.search:focus{border-color:#168451}
.hero{text-align:center;padding:35px 15px}
.hero h1{font-size:28px;margin-bottom:10px}
.hero p{color:#666}
.categories{display:flex;gap:10px;overflow-x:auto;padding:12px 5%}
.categories button{background:white;border:0;padding:12px 20px;border-radius:25px;white-space:nowrap;cursor:pointer}
.categories button.active{background:#168451;color:white}
.gallery{padding:20px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.photo{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #00000010}
.photo img{width:100%;height:190px;object-fit:cover;display:block;background:#eee}
.info{padding:12px}
.info h3{font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}
.download{display:block;background:#168451;color:white;text-align:center;text-decoration:none;padding:10px;border-radius:8px;font-size:13px}
.download:hover{background:#106b40}
#message{text-align:center;padding:25px 15px;color:#666}
footer{text-align:center;padding:30px;color:#777;font-size:13px}

@media(min-width:768px){
.gallery{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.photo img{height:240px}
}
@media(max-width:420px){
.logo{font-size:18px}
header{gap:9px}
.search{font-size:13px}
}
</style>
</head>

<body>

<header>
<div class="logo">MyGelary</div>
<input class="search" id="search" type="search"
placeholder="ছবি খুঁজুন..." aria-label="ছবি খুঁজুন">
</header>

<section class="hero">
<h1>সুন্দর ছবির সংগ্রহ</h1>
<p>আপনার পছন্দের ছবি খুঁজে নিন ও ডাউনলোড করুন</p>
</section>

<div class="categories" id="categories">
<button class="active" data-category="All">All Photos</button>
<button data-category="Nature">Nature</button>
<button data-category="Animals">Animals</button>
<button data-category="Fashion">Fashion</button>
<button data-category="People">People</button>
<button data-category="Others">Others</button>
</div>

<p id="message" role="status">ছবি লোড হচ্ছে...</p>
<main class="gallery" id="gallery"></main>

<footer>© 2026 MyGelary. All rights reserved.</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
 getFirestore,collection,query,where,onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBosbHSx4eTmruOh0AymBa-2Jd79h4IAl8",
 authDomain:"mygelary-58171.firebaseapp.com",
 projectId:"mygelary-58171",
 storageBucket:"mygelary-58171.firebasestorage.app",
 messagingSenderId:"747943092425",
 appId:"1:747943092425:web:eca37997c1b024fcd52d18"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const gallery=document.getElementById("gallery");
const message=document.getElementById("message");
const searchInput=document.getElementById("search");

let photos=[];
let currentCategory="All";

function getDownloadURL(url){
 try{
  const parsed=new URL(url);
  if(parsed.protocol!=="https:" ||
     parsed.hostname!=="res.cloudinary.com" ||
     !parsed.pathname.includes("/image/upload/")){
   return url;
  }
  parsed.pathname=parsed.pathname.replace(
   "/image/upload/",
   "/image/upload/fl_attachment/"
  );
  return parsed.href;
 }catch(error){
  return url;
 }
}

function renderPhotos(){
 const search=searchInput.value.trim().toLowerCase();

 const filtered=photos.filter(photo=>{
  const categoryMatch=
   currentCategory==="All" ||
   photo.category===currentCategory;

  const searchMatch=
   String(photo.title||"").toLowerCase().includes(search) ||
   String(photo.category||"").toLowerCase().includes(search);

  return categoryMatch && searchMatch;
 });

 gallery.replaceChildren();

 if(filtered.length===0){
  message.style.display="block";
  message.textContent="এই মুহূর্তে কোনো ছবি পাওয়া যায়নি।";
  return;
 }

 message.style.display="none";

 filtered.forEach(photo=>{
  if(!photo.url)return;

  const card=document.createElement("article");
  card.className="photo";

  const img=document.createElement("img");
  img.src=photo.url;
  img.alt=photo.title||"MyGelary Photo";
  img.loading="lazy";

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("h3");
  title.textContent=photo.title||"Untitled Photo";

  const download=document.createElement("a");
  download.className="download";
  download.href=getDownloadURL(photo.url);
  download.textContent="Download Photo";
  download.target="_blank";
  download.rel="noopener noreferrer";

  info.append(title,download);
  card.append(img,info);
  gallery.appendChild(card);
 });
}

searchInput.addEventListener("input",renderPhotos);

document.querySelectorAll("#categories button").forEach(button=>{
 button.addEventListener("click",()=>{
  currentCategory=button.dataset.category;

  document.querySelectorAll("#categories button").forEach(btn=>{
   btn.classList.remove("active");
  });

  button.classList.add("active");
  renderPhotos();
 });
});

const photosQuery=query(
 collection(db,"photos"),
 where("published","==",true)
);

onSnapshot(
 photosQuery,
 snapshot=>{
  photos=snapshot.docs.map(doc=>({
   id:doc.id,
   ...doc.data()
  }));

  photos.sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
  );

  renderPhotos();
 },
 error=>{
  console.error(error);
  message.style.display="block";
  message.textContent="ছবি লোড করা যাচ্ছে না: "+error.message;
 }
);
</script>
</body>
</html>
