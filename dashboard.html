<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyGelary | Admin Dashboard</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f5f7fa;
 font-family:Arial,sans-serif;
 color:#222;
}

header{
 background:white;
 padding:15px 5%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 box-shadow:0 2px 8px #00000010;
}

.logo{
 font-size:23px;
 font-weight:bold;
 color:#168451;
}

button{
 background:#168451;
 color:white;
 border:0;
 padding:12px 17px;
 border-radius:8px;
 cursor:pointer;
}

button:disabled{
 opacity:.6;
 cursor:wait;
}

main{
 max-width:850px;
 margin:30px auto;
 padding:0 16px;
}

.card{
 background:white;
 padding:24px;
 border-radius:15px;
 box-shadow:0 3px 15px #0000000d;
 margin-bottom:20px;
}

h2{margin-top:0}

label{
 display:block;
 margin:14px 0 7px;
}

input,select{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
}

.note{
 color:#666;
 font-size:14px;
}

#dashboard{display:none}

#status{
 margin-top:15px;
 overflow-wrap:anywhere;
 line-height:1.6;
}
</style>
</head>

<body>

<div id="loading" style="padding:30px;text-align:center">
লগইন যাচাই হচ্ছে...
</div>

<div id="dashboard">

<header>
 <div class="logo">MyGelary Admin</div>
 <button id="logout">Logout</button>
</header>

<main>

<section class="card">
 <h2>Welcome to MyGelary</h2>
 <p>এখান থেকে নতুন ছবি আপলোড করতে পারবে।</p>
</section>

<section class="card">

<h2>নতুন ছবি যোগ করুন</h2>

<label for="photoTitle">ছবির নাম</label>
<input
 id="photoTitle"
 type="text"
 placeholder="ছবির নাম লিখো"
>

<label for="category">Category</label>

<select id="category">
 <option>Nature</option>
 <option>Animals</option>
 <option>Fashion</option>
 <option>People</option>
 <option>Others</option>
</select>

<label for="photoFile">ছবি নির্বাচন করো</label>

<input
 id="photoFile"
 type="file"
 accept="image/jpeg,image/png,image/webp,image/gif"
>

<p class="note">
JPG, PNG, WEBP অথবা GIF ছবি; সর্বোচ্চ ৮ MB।
</p>

<button id="uploadBtn">Upload Photo</button>

<p id="status" role="status"></p>

</section>
</main>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyBosbHSx4eTmruOh0AymBa-2Jd79h4IAl8",
 authDomain: "mygelary-58171.firebaseapp.com",
 projectId: "mygelary-58171",
 storageBucket: "mygelary-58171.firebasestorage.app",
 messagingSenderId: "747943092425",
 appId: "1:747943092425:web:eca37997c1b024fcd52d18"
};

const ADMIN_UID = "Rw4DUvtOMkgJeZ4mnkZG3hc7dQ92";

const WORKER_URL =
"https://mygelary-upload.taijulsheikh60.workers.dev/";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const loading = document.getElementById("loading");
const dashboard = document.getElementById("dashboard");
const statusBox = document.getElementById("status");
const uploadBtn = document.getElementById("uploadBtn");

function showStatus(text, color="#333"){
 statusBox.style.color = color;
 statusBox.textContent = text;
}

// Admin Login Verification

onAuthStateChanged(auth, user => {

 loading.style.display = "none";

 if(user && user.uid === ADMIN_UID){
  dashboard.style.display = "block";
 }else{
  dashboard.style.display = "none";
  window.location.replace("admin.html");
 }

});

// Logout

document.getElementById("logout")
.addEventListener("click", async () => {

 await signOut(auth);

 window.location.replace("admin.html");

});

// Convert Image to Base64

function fileToDataURL(file){

 return new Promise((resolve,reject)=>{

  const reader = new FileReader();

  reader.onload = () => resolve(reader.result);

  reader.onerror = () =>
   reject(new Error("ছবি পড়া যায়নি।"));

  reader.readAsDataURL(file);

 });

}

// Upload Photo

uploadBtn.addEventListener("click", async () => {

 if(uploadBtn.disabled) return;

 const user = auth.currentUser;

 const file =
 document.getElementById("photoFile").files[0];

 const title =
 document.getElementById("photoTitle").value.trim();

 const category =
 document.getElementById("category").value;

 if(!user || user.uid !== ADMIN_UID){
  showStatus("Admin Login প্রয়োজন।","red");
  return;
 }

 if(!file){
  showStatus("আগে একটি ছবি নির্বাচন করো।","red");
  return;
 }

 if(file.size > 8 * 1024 * 1024){
  showStatus("ছবির সাইজ ৮ MB-এর কম হতে হবে।","red");
  return;
 }

 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){
  showStatus("JPG, PNG, WEBP অথবা GIF ছবি ব্যবহার করো।","red");
  return;
 }

 uploadBtn.disabled = true;

 showStatus("ছবি আপলোড হচ্ছে... অপেক্ষা করো।");

 try{

  // Refresh Firebase ID Token

  const idToken = await user.getIdToken(true);

  const imageBase64 = await fileToDataURL(file);

  // Send Image to Cloudflare Worker

  const uploadResponse = await fetch(WORKER_URL,{

   method:"POST",

   headers:{
    "Content-Type":"application/json"
   },

   body:JSON.stringify({
    idToken,
    imageBase64,
    filename:file.name
   })

  });

  const result = await uploadResponse.json();

  // Show Full Error Details

  if(!uploadResponse.ok || !result.success || !result.url){

   throw new Error(
    (result.error || "ছবি আপলোড ব্যর্থ হয়েছে।") +
    (result.detail ? " — " + result.detail : "")
   );

  }

  // Save Photo Information in Firestore

  await addDoc(collection(db,"photos"),{

   title:title || file.name,

   category:category,

   url:result.url,

   publicId:result.publicId,

   published:true,

   createdAt:serverTimestamp()

  });

  showStatus(
   "সফল! ছবি Upload হয়েছে এবং Firestore-এ Save হয়েছে।",
   "green"
  );

  document.getElementById("photoFile").value = "";

  document.getElementById("photoTitle").value = "";

 }catch(error){

  console.error(error);

  showStatus(
   "সমস্যা হয়েছে: " +
   (error.message || "আবার চেষ্টা করো।"),
   "red"
  );

 }finally{

  uploadBtn.disabled = false;

 }

});

</script>

</body>
  </html>
