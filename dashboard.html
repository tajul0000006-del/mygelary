<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyGelary | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#222}
header{background:#fff;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 8px #00000010}
.logo{font-size:21px;font-weight:bold;color:#168451}
button{background:#168451;color:#fff;border:0;padding:11px 15px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.danger{background:#c62828}
button.secondary{background:#475569}
main{max-width:950px;margin:25px auto;padding:0 16px}
.card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 3px 15px #0000000d;margin-bottom:20px}
h2{margin-top:0}
label{display:block;margin:14px 0 7px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.note{color:#666;font-size:14px}
#dashboard{display:none}
#status,#manageStatus{margin-top:15px;overflow-wrap:anywhere;line-height:1.6}
.photo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.photo-item{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;padding:12px;min-width:0}
.photo-item img{width:100%;height:170px;object-fit:cover;border-radius:8px;background:#eee}
.photo-item input,.photo-item select{margin-bottom:8px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actions button{flex:1;font-size:13px;padding:10px 8px}
.state{font-size:13px;margin:9px 0;color:#555}
.item-status{font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>

<div id="loading" style="padding:30px;text-align:center">
লগইন যাচাই হচ্ছে...
</div>

<div id="dashboard">
<header>
 <div class="logo">MyGelary Admin</div>
 <button id="logout" type="button">Logout</button>
</header>

<main>
<section class="card">
 <h2>Welcome to MyGelary</h2>
 <p>এখান থেকে ছবি Upload ও Manage করতে পারবে।</p>
</section>

<section class="card">
 <h2>নতুন ছবি যোগ করুন</h2>

 <label for="photoTitle">ছবির নাম</label>
 <input id="photoTitle" type="text" placeholder="ছবির নাম লিখো">

 <label for="category">Category</label>
 <select id="category">
  <option>Nature</option>
  <option>Animals</option>
  <option>Fashion</option>
  <option>People</option>
  <option>Others</option>
 </select>

 <label for="photoFile">ছবি নির্বাচন করো</label>
 <input id="photoFile" type="file"
 accept="image/jpeg,image/png,image/webp,image/gif">

 <p class="note">JPG, PNG, WEBP অথবা GIF; সর্বোচ্চ ৮ MB।</p>
 <button id="uploadBtn" type="button">Upload Photo</button>
 <p id="status" role="status"></p>
</section>

<section class="card">
 <h2>Manage Photos</h2>
 <p class="note">নাম ও Category পরিবর্তনের পর Save চাপবে। Unpublish করলে Homepage থেকে ছবিটি লুকিয়ে যাবে।</p>
 <p id="manageStatus" role="status">ছবির তালিকা লোড হচ্ছে...</p>
 <div id="photoList" class="photo-list"></div>
</section>
</main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
 getFirestore,collection,addDoc,serverTimestamp,
 onSnapshot,doc,updateDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBosbHSx4eTmruOh0AymBa-2Jd79h4IAl8",
 authDomain:"mygelary-58171.firebaseapp.com",
 projectId:"mygelary-58171",
 storageBucket:"mygelary-58171.firebasestorage.app",
 messagingSenderId:"747943092425",
 appId:"1:747943092425:web:eca37997c1b024fcd52d18"
};

const ADMIN_UID="Rw4DUvtOMkgJeZ4mnkZG3hc7dQ92";
const WORKER_URL="https://mygelary-upload.taijulsheikh60.workers.dev/";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loading=document.getElementById("loading");
const dashboard=document.getElementById("dashboard");
const statusBox=document.getElementById("status");
const uploadBtn=document.getElementById("uploadBtn");
const photoList=document.getElementById("photoList");
const manageStatus=document.getElementById("manageStatus");

let unsubscribePhotos=null;

function isAdmin(){
 return auth.currentUser?.uid===ADMIN_UID;
}

function showStatus(text,color="#333"){
 statusBox.style.color=color;
 statusBox.textContent=text;
}

onAuthStateChanged(auth,user=>{
 loading.style.display="none";

 if(user && user.uid===ADMIN_UID){
  dashboard.style.display="block";
  if(!unsubscribePhotos)loadPhotos();
 }else{
  if(unsubscribePhotos){
   unsubscribePhotos();
   unsubscribePhotos=null;
  }
  dashboard.style.display="none";
  window.location.replace("admin.html");
 }
});

document.getElementById("logout").addEventListener("click",async()=>{
 if(unsubscribePhotos){
  unsubscribePhotos();
  unsubscribePhotos=null;
 }
 await signOut(auth);
 window.location.replace("admin.html");
});

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(new Error("ছবি পড়া যায়নি।"));
  reader.readAsDataURL(file);
 });
}

/* নতুন ছবি Upload */
uploadBtn.addEventListener("click",async()=>{
 if(uploadBtn.disabled)return;

 const user=auth.currentUser;
 const file=document.getElementById("photoFile").files[0];
 const title=document.getElementById("photoTitle").value.trim();
 const category=document.getElementById("category").value;

 if(!user || user.uid!==ADMIN_UID){
  showStatus("Admin Login প্রয়োজন।","red");
  return;
 }

 if(!file){
  showStatus("আগে একটি ছবি নির্বাচন করো।","red");
  return;
 }

 if(file.size>8*1024*1024){
  showStatus("ছবির সাইজ সর্বোচ্চ ৮ MB হতে হবে।","red");
  return;
 }

 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){
  showStatus("JPG, PNG, WEBP অথবা GIF ছবি ব্যবহার করো।","red");
  return;
 }

 uploadBtn.disabled=true;
 showStatus("ছবি আপলোড হচ্ছে... অপেক্ষা করো।");

 try{
  const idToken=await user.getIdToken(true);
  const imageBase64=await fileToDataURL(file);

  const uploadResponse=await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    idToken,
    imageBase64,
    filename:file.name
   })
  });

  const result=await uploadResponse.json();

  if(!uploadResponse.ok || !result.success || !result.url){
   throw new Error(
    (result.error || "ছবি আপলোড ব্যর্থ হয়েছে।")+
    (result.detail ? " — "+result.detail : "")
   );
  }

  await addDoc(collection(db,"photos"),{
   title:title || file.name,
   category,
   url:result.url,
   publicId:result.publicId || "",
   published:true,
   createdAt:serverTimestamp()
  });

  showStatus(
   "সফল! ছবি Upload হয়েছে এবং Firestore-এ Save হয়েছে।",
   "green"
  );

  document.getElementById("photoFile").value="";
  document.getElementById("photoTitle").value="";

 }catch(error){
  console.error(error);
  showStatus("সমস্যা হয়েছে: "+error.message,"red");
 }finally{
  uploadBtn.disabled=false;
 }
});

/* ছবি Management */
function loadPhotos(){
 unsubscribePhotos=onSnapshot(
  collection(db,"photos"),
  snapshot=>{
   const photos=snapshot.docs.map(d=>({
    id:d.id,
    ...d.data()
   }));

   photos.sort((a,b)=>
    (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
   );

   manageStatus.textContent="মোট ছবি: "+photos.length+"টি";
   renderManagePhotos(photos);
  },
  error=>{
   manageStatus.textContent="ছবি লোড হয়নি: "+error.message;
  }
 );
}

function renderManagePhotos(photos){
 photoList.replaceChildren();

 if(!photos.length){
  const p=document.createElement("p");
  p.textContent="এখনো কোনো ছবি নেই।";
  photoList.appendChild(p);
  return;
 }

 photos.forEach(photo=>{
  const item=document.createElement("article");
  item.className="photo-item";

  const img=document.createElement("img");
  img.alt=photo.title||"Photo";
  if(typeof photo.url==="string" && /^https:\/\//.test(photo.url)){
   img.src=photo.url;
  }

  const titleLabel=document.createElement("label");
  titleLabel.textContent="Photo Title";

  const titleInput=document.createElement("input");
  titleInput.value=photo.title||"";
  titleInput.maxLength=120;

  const categoryLabel=document.createElement("label");
  categoryLabel.textContent="Category";

  const categorySelect=document.createElement("select");
  ["Nature","Animals","Fashion","People","Others"].forEach(name=>{
   const option=document.createElement("option");
   option.value=name;
   option.textContent=name;
   categorySelect.appendChild(option);
  });

  if(!["Nature","Animals","Fashion","People","Others"].includes(photo.category)){
   const option=document.createElement("option");
   option.value=photo.category||"Others";
   option.textContent=photo.category||"Others";
   categorySelect.appendChild(option);
  }
  categorySelect.value=photo.category||"Others";

  const state=document.createElement("p");
  state.className="state";
  state.textContent=photo.published===true
   ?"Status: Published"
   :"Status: Unpublished";

  const actions=document.createElement("div");
  actions.className="actions";

  const saveBtn=document.createElement("button");
  saveBtn.textContent="Save";

  const publishBtn=document.createElement("button");
  publishBtn.className="secondary";
  publishBtn.textContent=photo.published===true
   ?"Unpublish"
   :"Publish";

  const deleteBtn=document.createElement("button");
  deleteBtn.className="danger";
  deleteBtn.textContent="Delete";

  const itemStatus=document.createElement("p");
  itemStatus.className="item-status";
  itemStatus.setAttribute("role","status");

  function busy(value){
   saveBtn.disabled=value;
   publishBtn.disabled=value;
   deleteBtn.disabled=value;
  }

  saveBtn.addEventListener("click",async()=>{
   if(!isAdmin())return;

   const newTitle=titleInput.value.trim();
   if(!newTitle){
    itemStatus.textContent="ছবির নাম খালি রাখা যাবে না।";
    return;
   }

   busy(true);
   itemStatus.textContent="Save হচ্ছে...";

   try{
    await updateDoc(doc(db,"photos",photo.id),{
     title:newTitle,
     category:categorySelect.value
    });
    itemStatus.textContent="পরিবর্তন Save হয়েছে।";
   }catch(error){
    itemStatus.textContent="Error: "+error.message;
   }finally{
    busy(false);
   }
  });

  publishBtn.addEventListener("click",async()=>{
   if(!isAdmin())return;

   busy(true);
   itemStatus.textContent="Status পরিবর্তন হচ্ছে...";

   try{
    await updateDoc(doc(db,"photos",photo.id),{
     published:photo.published!==true
    });
    itemStatus.textContent="Status পরিবর্তন হয়েছে।";
   }catch(error){
    itemStatus.textContent="Error: "+error.message;
    busy(false);
   }
  });

  deleteBtn.addEventListener("click",async()=>{
   if(!isAdmin())return;

   const confirmed=confirm(
    "এই ছবিটি Homepage ও Firestore থেকে সরাতে চাও? Cloudinary-এর মূল ফাইল মুছবে না।"
   );

   if(!confirmed)return;

   busy(true);
   itemStatus.textContent="Delete হচ্ছে...";

   try{
    await deleteDoc(doc(db,"photos",photo.id));
   }catch(error){
    itemStatus.textContent="Error: "+error.message;
    busy(false);
   }
  });

  actions.append(saveBtn,publishBtn,deleteBtn);

  item.append(
   img,titleLabel,titleInput,
   categoryLabel,categorySelect,
   state,actions,itemStatus
  );

  photoList.appendChild(item);
 });
}
</script>
</body>
 </html>
